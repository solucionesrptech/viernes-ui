<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viernes — AI Core</title>
  </head>
  <body>
    <div id="app" class="ai-shell" data-workspace="home" data-state="idle">
      <div class="ai-shell__atmosphere" aria-hidden="true"></div>
      <div class="ai-shell__grain" aria-hidden="true"></div>

      <header class="ai-shell__top">
        <div class="ai-shell__identity">
          <span class="ai-shell__mark" id="voice-indicator" data-status="inactive"></span>
          <div>
            <p class="ai-shell__eyebrow">SISTEMA LOCAL</p>
            <p class="ai-shell__title">VIERNES</p>
          </div>
        </div>
        <nav class="ai-shell__nav" aria-label="Workspaces">
          <button
            type="button"
            class="ai-shell__nav-btn"
            data-workspace-target="home"
            aria-pressed="true"
          >
            Home
          </button>
          <button
            type="button"
            class="ai-shell__nav-btn"
            data-workspace-target="spatial"
            aria-pressed="false"
          >
            Espacial 3D
          </button>
        </nav>
      </header>

      <main class="ai-shell__stage">
        <section
          class="workspace workspace--home"
          data-workspace-panel="home"
          aria-label="AI Core"
        >
          <div id="viernes-core-host" class="ai-shell__core-host"></div>
          <div class="ai-shell__status-block">
            <p class="ai-shell__status" id="voice-status" aria-live="polite">
              Viernes en espera
            </p>
            <p class="ai-shell__transcript" id="voice-transcript">
              Di “Hola, Viernes” o “Viernes, ¿estás despierta?”
            </p>
          </div>
        </section>

        <section
          class="workspace workspace--spatial"
          data-workspace-panel="spatial"
          aria-label="Workspace espacial 3D"
          hidden
        >
          <canvas id="scene-canvas" aria-label="Escena 3D de Viernes"></canvas>
          <p class="spatial-hud">Workspace espacial — cubo 3D</p>
        </section>
      </main>

      <aside class="ai-shell__dock" aria-label="Controles de voz">
        <label class="ai-shell__label" for="voice-select">Voz</label>
        <div class="ai-shell__voice-row">
          <select class="ai-shell__select" id="voice-select">
            <option>Cargando voces…</option>
          </select>
          <button class="ai-shell__btn ai-shell__btn--ghost" id="voice-preview" type="button">
            Probar
          </button>
        </div>
        <button class="ai-shell__btn ai-shell__btn--primary" id="voice-toggle" type="button">
          Activar Viernes
        </button>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
